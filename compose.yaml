services:
  client:
    image:  saadu0224/client
    container_name: noteapp-client
    ports:
      - "4173:4173"
    depends_on:
      - server

  server:
    image:  saadu0224/server
    container_name: noteapp-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URL=mongodb://mongo/noteapp
    depends_on:
      - mongo

  mongo:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    # environment:
    #   - MONGO_INITDB_ROOT_USERNAME=admin
    #   - MONGO_INITDB_ROOT_PASSWORD=mypassword
    volumes:
      - mongodbdata:/data/db
volumes:
  mongodbdata:
    driver: local